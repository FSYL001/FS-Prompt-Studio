<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta
      name="description"
      content="FS-Prompt Studio：中文优先的 AI 生图提示词编辑器。独立草稿、中英双框翻译与对照、点词加权、LoRA 记事本与 @触发词、成品历史与 ComfyUI 导出，数据默认保存在本地。"
    />
    <title>FS-Prompt Studio · AI 生图提示词编辑器</title>
    <meta name="author" content="FSYL001" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      try {
        var t = localStorage.getItem('prompt-studio-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
